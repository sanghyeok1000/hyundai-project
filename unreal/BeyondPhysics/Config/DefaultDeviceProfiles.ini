; Pleos uses its own manufacturer/model instead of Google's default AVD identity.
; Match both the known Pleos model and emulator GPU; never force this on real cars.
[/Script/AndroidDeviceProfileSelector.AndroidDeviceProfileMatchingRules]
+MatchProfile=(Profile="Android_Emulator",Match=((SourceType=SRC_DeviceModel,CompareType=CMP_Equal,MatchString="Connect on x86_64 emulator"),(SourceType=SRC_GpuFamily,CompareType=CMP_Regex,MatchString="Android Emulator")))
